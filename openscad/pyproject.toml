[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openscad"
version = "1.0.0"
description = '3D Modeling with OpenSCAD & SolidPython'
requires-python = ">=3.10"
keywords = []
authors = [{ name = "Craig N. Caroon" }]

dependencies = ["invoke ~= 3.0", "solidpython2 ~= 2.1", "watchdog ~= 6.0"]

# NO artifacts to build
[tool.hatch.build.targets.sdist]
exclude = ["*"]

[tool.hatch.build.targets.wheel]
include = ["*"]
exclude = ["*"]
